name: hermes-handle-it
label: Handle It
version: "0.1.0"
author: casualsav
license: MIT
description: >
  Handle It: your agent sits in the customer support chat so you don't have to. Hermes holds a company's live customer-support chat for you in its own browser: it waits on the
  human agent for as long as it takes, negotiates toward your goal, and asks you before it agrees to
  an offer, pays, cancels or shares a detail you did not allow. Ends with the outcome and a transcript.
requires_hermes: ">=0.21.5"
provides_tools:
  - support_chat_start
  - support_chat_send
  - support_chat_wait
  - support_chat_end
  - support_call_start
  - support_call_wait
  - support_call_end
provides_hooks:
  - pre_tool_call
  - on_session_finalize
python_dependencies:
  - "playwright>=1.40,<2"
requires_env:
  - name: BLAND_API_KEY
    description: "Optional, for phone calls only: your bland.ai API key (leave empty to use support chats alone)"
    url: "https://app.bland.ai"
    secret: true
config_schema:
  bland_api_url:
    type: str
    default: "https://api.bland.ai"
    description: "bland.ai API address (point it at demo/bland_standin.py to try calls without a real account)"
    required: false
  call_bridge_url:
    type: str
    default: ""
    description: "Public HTTPS address (a tunnel or reverse proxy) that reaches the call approval bridge; empty means a call agrees to nothing and brings every offer back"
    required: false
  call_bridge_port:
    type: int
    default: 8788
    description: "Local port the call approval bridge listens on (127.0.0.1)"
    required: false
