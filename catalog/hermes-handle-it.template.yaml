# Template for this plugin's entry in the Hermes plugin catalog, not the live entry.
# The live entry, with the release commit's real sha, is the one in the catalog's pull request:
# a commit cannot carry its own sha, so this copy never holds one.
name: hermes-handle-it
repo: https://github.com/casualsav/hermes-handle-it
sha: "<release commit sha, filled in the catalog pull request>"
description: "Handle It: your agent sits in the customer support chat so you don't have to. Hermes holds a company's live customer-support
  chat for you in its own browser, negotiates toward your goal for as long as it takes, and asks
  you before it agrees to an offer, pays, cancels or shares a detail you did not allow. Ends with
  the outcome and a saved transcript. Disclosure: opens the support pages you name in a local
  Chromium (Playwright) with its own profile under $HERMES_HOME/hermes-handle-it, or in Hermes's own
  browser when browser.cdp_url is set, public addresses only (every page, redirect hop and frame is
  resolved; private, loopback, link-local and cloud metadata addresses are refused), types messages
  into them on your behalf, and saves transcripts and screenshots there. Never reads passwords or
  Hermes's vault: a sign-in is made by Hermes itself. For phone calls: talks to bland.ai's API with
  your own key (BLAND_API_KEY, read through Hermes's profile-scoped secrets), places a phone call to
  a number you name only after you approve it, bland.ai records the call when you ask, and call
  costs are yours, billed by bland.ai. No other network calls, no telemetry, no stored credentials."
maintainer: casualsav
tier: community
category: automation
title: Handle It
requires_hermes: ">=0.21.5"
docs_url: https://github.com/casualsav/hermes-handle-it
version: "0.1.0"
platforms: [linux, macos]
capabilities:
  provides_tools:
    - support_chat_start
    - support_chat_send
    - support_chat_wait
    - support_chat_end
    - support_call_start
    - support_call_wait
    - support_call_end
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - on_session_finalize
  provides_middleware: []
  requires_env:
    - BLAND_API_KEY
