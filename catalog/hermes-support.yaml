name: hermes-support
repo: https://github.com/casualsav/hermes-support
sha: 0000000000000000000000000000000000000000
description: "It waits on hold so you don't: Hermes holds a company's live customer-support
  chat for you in its own browser, negotiates toward your goal for as long as it takes, and asks
  you before it agrees to an offer, pays, cancels or shares a detail you did not allow. Ends with
  the outcome and a saved transcript. Disclosure: opens the support pages you name in a local
  Chromium (Playwright) with its own profile under $HERMES_HOME/hermes-support, types messages
  into them on your behalf, reads a password from Hermes's vault only for a login handle it is given
  and types it only on that login's own origin, and saves transcripts and screenshots there; no other network calls,
  no telemetry, no stored credentials."
maintainer: casualsav
tier: community
category: automation
title: Hermes Support
requires_hermes: ">=0.21.5"
docs_url: https://github.com/casualsav/hermes-support
version: "0.1.0"
platforms: [linux, macos]
capabilities:
  provides_tools:
    - support_chat_start
    - support_chat_send
    - support_chat_wait
    - support_chat_end
  provides_hooks:
    - pre_tool_call
    - on_session_finalize
  provides_middleware: []
  requires_env: []
